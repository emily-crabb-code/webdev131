<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="card">
        <div class="image-container">
            <img src="Astras.jpg" alt="image of character">
        </div>
        <h1 class="name">Astra Theta</h1>
        <div class="stats">
            <p>Class: Sorcerer</p>
            <p>Level: <span id="level">1</span> </p>
            <p>Health: <span id="health">60</span></p>
        </div>
        <div class="buttons">
            <button id="attack">Attacked</button>
            <button id="level-up">Level Up</button>
        </div>


    </div>
    
</body>
</html>
